
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Document Reader</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;
  background: #080808;
  color: #f2f2f2;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: min(100%, 760px);
  margin: 0 auto;
}

h1 {
  color: #ff3030;
  margin-bottom: 6px;
}

.subtitle {
  color: #999;
  margin-top: 0;
}

.panel {
  background: #151515;
  border: 1px solid #303030;
  border-radius: 16px;
  padding: 18px;
  margin-top: 18px;
}

input[type="file"] {
  width: 100%;
  padding: 14px;
  background: #202020;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #e32636;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button.secondary {
  background: #292929;
  border: 1px solid #444;
}

button:disabled {
  opacity: 0.5;
}

#status {
  color: #aaa;
  margin-top: 14px;
  line-height: 1.5;
}

#output {
  width: 100%;
  min-height: 300px;
  resize: vertical;
  padding: 14px;
  margin-top: 12px;
  background: #0d0d0d;
  color: #eee;
  border: 1px solid #393939;
  border-radius: 10px;
  font: 14px/1.6 monospace;
}

#output:focus {
  outline: 1px solid #e32636;
}

.small {
  color: #888;
  font-size: 12px;
  line-height: 1.5;
}

</style>
</head>
<body>

<main>
  <h1>NOVA Document Reader</h1>
  <p class="subtitle">Extract text from your documents.</p>

  <section class="panel">
    <input
      id="fileInput"
      type="file"
      accept=".txt,.pdf,.docx"
    >

    <button id="readButton">READ DOCUMENT</button>

    <p id="status">Choose a TXT, PDF or DOCX file.</p>
    <p class="small">
      Your document is processed in your browser.
      The document contents are not uploaded to a server.
    </p>
  </section>

  <section class="panel">
    <label for="output">Extracted text</label>

    <textarea
      id="output"
      placeholder="Your document text will appear here..."
    ></textarea>

    <button id="copyButton">COPY TEXT FOR NOVA</button>
    <button id="downloadButton" class="secondary">
      SAVE EXTRACTED TEXT
    </button>
  </section>
</main>

<script>
const fileInput = document.getElementById("fileInput");
const readButton = document.getElementById("readButton");
const copyButton = document.getElementById("copyButton");
const downloadButton = document.getElementById("downloadButton");
const output = document.getElementById("output");
const status = document.getElementById("status");

const PDF_VERSION = "3.11.174";
const MAMMOTH_VERSION = "1.8.0";

let pdfLibraryPromise;
let mammothLibraryPromise;

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = url;
    script.onload = resolve;
    script.onerror = () => reject(
      new Error("Could not load document library. Check your internet connection.")
    );
    document.head.appendChild(script);
  });
}

async function loadPDFLibrary() {
  if (!pdfLibraryPromise) {
    pdfLibraryPromise = loadScript(
      `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDF_VERSION}/pdf.min.js`
    ).then(() => {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDF_VERSION}/pdf.worker.min.js`;
      return pdfjsLib;
    });
  }

  return pdfLibraryPromise;
}

async function loadMammothLibrary() {
  if (!mammothLibraryPromise) {
    mammothLibraryPromise = loadScript(
      `https://cdnjs.cloudflare.com/ajax/libs/mammoth/${MAMMOTH_VERSION}/mammoth.browser.min.js`
    ).then(() => mammoth);
  }

  return mammothLibraryPromise;
}

async function readTXT(file) {
  return await file.text();
}

async function readPDF(file) {
  const pdfjs = await loadPDFLibrary();
  const data = await file.arrayBuffer();

  const pdf = await pdfjs.getDocument({
    data
  }).promise;

  let pages = [];

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    status.textContent =
      `Reading PDF page ${pageNumber} of ${pdf.numPages}...`;

    const page = await pdf.getPage(pageNumber);
    const content = await page.getTextContent();

    const pageText = content.items
      .map(item => item.str)
      .join(" ");

    pages.push(pageText);
  }

  return pages.join("\n\n");
}

async function readDOCX(file) {
  const mammothLibrary = await loadMammothLibrary();
  const data = await file.arrayBuffer();

  const result = await mammothLibrary.extractRawText({
    arrayBuffer: data
  });

  return result.value;
}

async function readDocument(file) {
  const extension = file.name.split(".").pop().toLowerCase();

  if (extension === "txt") {
    return await readTXT(file);
  }

  if (extension === "pdf") {
    return await readPDF(file);
  }

  if (extension === "docx") {
    return await readDOCX(file);
  }

  throw new Error("Unsupported file format.");
}

readButton.addEventListener("click", async () => {
  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Choose a document first.";
    return;
  }

  readButton.disabled = true;
  output.value = "";

  try {
    status.textContent = "Reading document...";

    const text = await readDocument(file);

    if (!text.trim()) {
      throw new Error(
        "No readable text found. This PDF might contain scanned images."
      );
    }

    output.value = text;

    status.textContent =
      `Finished. ${text.length.toLocaleString()} characters extracted.`;

  } catch (error) {
    status.textContent = error.message;
  } finally {
    readButton.disabled = false;
  }
});

copyButton.addEventListener("click", async () => {
  if (!output.value.trim()) {
    status.textContent = "There is no extracted text to copy.";
    return;
  }

  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = "Text copied. Paste it into NOVA's chat.";
  } catch {
    output.select();
    status.textContent = "Select and copy the text manually.";
  }
});

downloadButton.addEventListener("click", () => {
  if (!output.value.trim()) {
    status.textContent = "There is no text to save.";
    return;
  }

  const blob = new Blob(
    [output.value],
    { type: "text/plain;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "nova-extracted-document.txt";
  link.click();

  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
