
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Image Reader</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;
  background: #080808;
  color: #f2f2f2;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: min(100%, 760px);
  margin: auto;
}

h1 {
  color: #ff3030;
}

.subtitle, .small {
  color: #999;
}

.panel {
  background: #151515;
  border: 1px solid #303030;
  border-radius: 16px;
  padding: 18px;
  margin-top: 18px;
}

input, select {
  width: 100%;
  padding: 13px;
  background: #202020;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #e32636;
  color: white;
  font-size: 15px;
  font-weight: 600;
}

button.secondary {
  background: #292929;
  border: 1px solid #444;
}

button:disabled {
  opacity: 0.5;
}

#preview {
  display: none;
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  margin-top: 16px;
  border-radius: 10px;
  background: #080808;
}

textarea {
  width: 100%;
  min-height: 240px;
  margin-top: 12px;
  padding: 14px;
  resize: vertical;
  background: #0d0d0d;
  color: white;
  border: 1px solid #393939;
  border-radius: 10px;
  font: 14px/1.6 monospace;
}

#status {
  color: #aaa;
  line-height: 1.5;
}
</style>
</head>

<body>
<main>
  <h1>NOVA Image Reader</h1>
  <p class="subtitle">Extract text from photos and screenshots.</p>

  <section class="panel">
    <label for="imageInput">Choose an image</label>
    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >

    <img id="preview" alt="Selected image preview">

    <label for="language">Recognition language</label>
    <select id="language">
      <option value="eng">English</option>
      <option value="fra">French</option>
      <option value="deu">German</option>
      <option value="spa">Spanish</option>
    </select>

    <button id="readButton">READ IMAGE</button>
    <p id="status">Choose an image to begin.</p>
    <p class="small">
      OCR processes the image in your browser.
      The image is not uploaded to a server.
    </p>
  </section>

  <section class="panel">
    <label for="output">Recognized text</label>
    <textarea
      id="output"
      placeholder="Recognized text will appear here..."
    ></textarea>

    <button id="copyButton">COPY TEXT FOR NOVA</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const readButton = document.getElementById("readButton");
const copyButton = document.getElementById("copyButton");
const output = document.getElementById("output");
const status = document.getElementById("status");
const language = document.getElementById("language");

let imageURL = null;
let worker = null;

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];

  if (!file) return;

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
  }

  imageURL = URL.createObjectURL(file);
  preview.src = imageURL;
  preview.style.display = "block";

  output.value = "";
  status.textContent = "Image selected.";
});

readButton.addEventListener("click", async () => {
  const file = imageInput.files[0];

  if (!file) {
    status.textContent = "Choose an image first.";
    return;
  }

  if (!window.Tesseract) {
    status.textContent = "OCR library failed to load. Check your connection.";
    return;
  }

  readButton.disabled = true;
  output.value = "";

  try {
    status.textContent = "Loading recognition engine...";

    if (worker) {
      await worker.terminate();
      worker = null;
    }

    worker = await Tesseract.createWorker(
      language.value,
      1,
      {
        logger: message => {
          if (message.status) {
            const progress = message.progress
              ? Math.round(message.progress * 100) + "%"
              : "";

            status.textContent =
              message.status + " " + progress;
          }
        }
      }
    );

    status.textContent = "Recognizing text...";

    const result = await worker.recognize(file);

    output.value = result.data.text || "";

    if (output.value.trim()) {
      status.textContent = "Image processed successfully.";
    } else {
      status.textContent = "No readable text was found.";
    }

    await worker.terminate();
    worker = null;

  } catch (error) {
    status.textContent = "Error: " + error.message;

    if (worker) {
      await worker.terminate();
      worker = null;
    }
  } finally {
    readButton.disabled = false;
  }
});

copyButton.addEventListener("click", async () => {
  if (!output.value.trim()) {
    status.textContent = "There is no text to copy.";
    return;
  }

  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = "Text copied. Paste it into NOVA.";
  } catch {
    output.select();
    status.textContent = "Select and copy the text manually.";
  }
});
</script>
</body>
</html>
