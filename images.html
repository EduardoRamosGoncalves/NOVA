
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>NOVA Image Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: #080808;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 26px;
    }

    .panel {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    button, input, textarea {
      width: 100%;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #d92727;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input[type="file"] {
      margin-top: 12px;
      color: #aaa;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #090909;
      color: white;
      line-height: 1.5;
    }

    img {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin-top: 16px;
      border-radius: 12px;
      background: #080808;
    }

    .status {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .green {
      color: #54d68b;
    }

    .red {
      color: #ff6464;
    }

    .label {
      display: block;
      margin-bottom: 10px;
      font-weight: 650;
    }

    .secondary {
      background: #292929;
    }

    .small {
      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>NOVA Image Reader</h1>
  <div class="subtitle">Analyze an image and send its description to NOVA.</div>

  <section class="panel">
    <label class="label" for="imageInput">1. Choose an image</label>
    <input id="imageInput" type="file" accept="image/*">
    <img id="preview" alt="Selected image preview">

    <button id="loadButton">LOAD IMAGE AI</button>
    <button id="analyzeButton" disabled>ANALYZE IMAGE</button>

    <div id="modelStatus" class="status">Image AI is not loaded.</div>
  </section>

  <section class="panel">
    <label class="label" for="caption">2. Image description</label>
    <textarea id="caption" placeholder="The image description will appear here. You can edit it before sending."></textarea>

    <button id="sendButton" disabled>SEND TO NOVA</button>
    <div id="sendStatus" class="status">Nothing sent yet.</div>
  </section>

  <p class="small">
    The image caption is generated locally. NOVA receives the description as text, not the original image pixels. The first model download requires internet access.
  </p>
</main>

<script type="module">
  import { pipeline } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

  const $ = id => document.getElementById(id);

  const imageInput = $("imageInput");
  const preview = $("preview");
  const loadButton = $("loadButton");
  const analyzeButton = $("analyzeButton");
  const sendButton = $("sendButton");
  const caption = $("caption");
  const modelStatus = $("modelStatus");
  const sendStatus = $("sendStatus");

  const IMPORT_KEY = "nova_imported_context";

  let selectedFile = null;
  let imageURL = null;
  let captioner = null;

  function setStatus(element, message, type = "") {
    element.textContent = message;
    element.className = "status " + type;
  }

  imageInput.addEventListener("change", () => {
    selectedFile = imageInput.files?.[0] || null;
    caption.value = "";
    sendButton.disabled = true;
    setStatus(sendStatus, "Nothing sent yet.");

    if (imageURL) {
      URL.revokeObjectURL(imageURL);
      imageURL = null;
    }

    if (!selectedFile) {
      preview.style.display = "none";
      return;
    }

    if (!selectedFile.type.startsWith("image/")) {
      selectedFile = null;
      setStatus(modelStatus, "Please choose a valid image.", "red");
      return;
    }

    imageURL = URL.createObjectURL(selectedFile);
    preview.src = imageURL;
    preview.style.display = "block";

    setStatus(
      modelStatus,
      "Image selected: " + selectedFile.name
    );
  });

  loadButton.addEventListener("click", async () => {
    if (captioner) {
      setStatus(modelStatus, "Image AI is ready.", "green");
      return;
    }

    loadButton.disabled = true;
    setStatus(modelStatus, "Loading image AI. First load requires internet.");

    try {
      captioner = await pipeline(
        "image-to-text",
        "Xenova/vit-gpt2-image-captioning"
      );

      analyzeButton.disabled = false;
      setStatus(modelStatus, "Image AI is ready.", "green");
    } catch (error) {
      console.error(error);
      captioner = null;
      setStatus(
        modelStatus,
        "Could not load image AI: " + error.message,
        "red"
      );
    } finally {
      loadButton.disabled = false;
    }
  });

  analyzeButton.addEventListener("click", async () => {
    if (!selectedFile || !imageURL || !captioner) {
      setStatus(modelStatus, "Choose an image and load image AI first.", "red");
      return;
    }

    analyzeButton.disabled = true;
    sendButton.disabled = true;
    setStatus(modelStatus, "Analyzing image...");

    try {
      const result = await captioner(imageURL);
      const description = Array.isArray(result)
        ? result[0]?.generated_text
        : result?.generated_text;

      if (!description) {
        throw new Error("The image model returned no description.");
      }

      caption.value = description.trim();
      sendButton.disabled = !caption.value.trim();

      setStatus(modelStatus, "Image analysis complete.", "green");
    } catch (error) {
      console.error(error);
      setStatus(
        modelStatus,
        "Image analysis failed: " + error.message,
        "red"
      );
    } finally {
      analyzeButton.disabled = false;
    }
  });

  sendButton.addEventListener("click", () => {
    const text = caption.value.trim();

    if (!text) {
      setStatus(sendStatus, "There is no description to send.", "red");
      return;
    }

    const payload = {
      name: selectedFile?.name || "Image",
      filename: selectedFile?.name || "Image",
      type: "image caption",
      text: text,
      caption: text,
      sentAt: new Date().toISOString()
    };

    try {
      localStorage.setItem(IMPORT_KEY, JSON.stringify(payload));

      const saved = localStorage.getItem(IMPORT_KEY);

      if (!saved) {
        throw new Error("The saved data could not be read back.");
      }

      const verification = JSON.parse(saved);

      if (verification.text !== text) {
        throw new Error("The saved description does not match.");
      }

      setStatus(
        sendStatus,
        "Description saved successfully. Opening NOVA...",
        "green"
      );

      sendButton.disabled = true;

      setTimeout(() => {
        window.location.href = "./index.html?import=1";
      }, 500);

    } catch (error) {
      console.error(error);
      setStatus(
        sendStatus,
        "Transfer failed: " + error.message,
        "red"
      );
    }
  });
</script>
</body>
</html>
