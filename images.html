
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Vision</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 22px;
  background: #080808;
  color: #f2f2f2;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: min(100%, 760px);
  margin: auto;
}

h1 { color: #ff3030; }

.panel {
  background: #151515;
  border: 1px solid #303030;
  border-radius: 16px;
  padding: 18px;
  margin-top: 18px;
}

input {
  width: 100%;
  padding: 13px;
  background: #202020;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #e32636;
  color: white;
  font-size: 15px;
  font-weight: 600;
}

button:disabled { opacity: 0.5; }

#preview {
  display: none;
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  margin-top: 16px;
  border-radius: 10px;
}

textarea {
  width: 100%;
  min-height: 180px;
  margin-top: 12px;
  padding: 14px;
  background: #0d0d0d;
  color: white;
  border: 1px solid #393939;
  border-radius: 10px;
  font: 14px/1.6 monospace;
}

#status {
  color: #aaa;
  line-height: 1.5;
}
</style>
</head>

<body>
<main>
  <h1>NOVA Vision</h1>
  <p>Local image description.</p>

  <section class="panel">
    <input id="imageInput" type="file" accept="image/*">
    <img id="preview" alt="Selected image">
    <button id="analyzeButton">ANALYZE IMAGE</button>
    <p id="status">Choose an image to begin.</p>
  </section>

  <section class="panel">
    <label for="output">Image description</label>
    <textarea id="output" readonly></textarea>
    <button id="copyButton">COPY DESCRIPTION FOR NOVA</button>
  </section>
</main>

<script type="module">
import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

const $ = id => document.getElementById(id);

const imageInput = $("imageInput");
const preview = $("preview");
const analyzeButton = $("analyzeButton");
const copyButton = $("copyButton");
const status = $("status");
const output = $("output");

let imageURL = null;
let captioner = null;

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if (!file) return;

  if (imageURL) URL.revokeObjectURL(imageURL);

  imageURL = URL.createObjectURL(file);
  preview.src = imageURL;
  preview.style.display = "block";
  output.value = "";
  status.textContent = "Image selected.";
});

analyzeButton.addEventListener("click", async () => {
  const file = imageInput.files[0];

  if (!file) {
    status.textContent = "Choose an image first.";
    return;
  }

  analyzeButton.disabled = true;
  output.value = "";

  try {
    if (!captioner) {
      status.textContent = "Loading vision model. First download may take a while.";

      captioner = await pipeline(
        "image-to-text",
        "Xenova/vit-gpt2-image-captioning"
      );
    }

    status.textContent = "Analyzing image...";

    const result = await captioner(preview);

    const description = result
      .map(item => item.generated_text)
      .filter(Boolean)
      .join("\n");

    output.value = description || "No description was generated.";
    status.textContent = "Image analysis complete.";

  } catch (error) {
    status.textContent = "Error: " + error.message;
  } finally {
    analyzeButton.disabled = false;
  }
});

copyButton.addEventListener("click", async () => {
  if (!output.value.trim()) {
    status.textContent = "No description to copy.";
    return;
  }

  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = "Copied. Paste the description into NOVA.";
  } catch {
    output.select();
    status.textContent = "Select and copy the description manually.";
  }
});
</script>
</body>
</html>
