
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="NOVA, your private local AI assistant.">
  <title>NOVA</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<main class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>NOVA</h1>
        <p id="status">LOCAL ASSISTANT · AI NOT LOADED</p>
      </div>
    </div>
    <div class="header-buttons">
      <button id="loadModelButton" class="load-button">LOAD AI</button>
      <button id="clearButton" class="clear-button">＋</button>
    </div>
  </header>

  <nav class="navigation">
    <button class="nav-button active" data-screen="chatScreen">CHAT</button>
    <button class="nav-button" data-screen="notesScreen">NOTES</button>
    <button class="nav-button" data-screen="tasksScreen">TASKS</button>
  </nav>

  <section id="chatScreen" class="screen">
    <div id="progressArea" class="progress-area">
      <div id="progressText">AI model not loaded</div>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>

    <section id="chatMessages" class="messages"></section>

    <div id="attachmentPreview" class="attachment-preview" hidden></div>

    <form id="chatForm" class="composer">
      <input id="fileInput" type="file"
        accept=".txt,.md,.csv,.json,.pdf,.docx,image/*"
        multiple hidden>
      <button id="attachButton" type="button" class="attach-button"
        aria-label="Attach files">＋</button>
      <input id="messageInput" type="text"
        placeholder="Message NOVA..." autocomplete="off">
      <button id="sendButton" type="submit">SEND</button>
    </form>
    <p class="attachment-hint">TXT, MD, CSV, JSON, PDF, DOCX and images</p>
  </section>

  <section id="notesScreen" class="screen" hidden>
    <section class="notes-panel">
      <div class="notes-heading">
        <div>
          <h2>MY NOTES</h2>
          <p id="notesSummary">0 saved notes</p>
        </div>
        <span class="notes-icon">✎</span>
      </div>
      <form id="noteForm" class="note-form">
        <input id="noteTitle" type="text" placeholder="Note title"
          maxlength="100" required>
        <textarea id="noteContent" placeholder="Write your note..."
          rows="3" maxlength="5000" required></textarea>
        <button type="submit" class="note-add-button">SAVE NOTE</button>
      </form>
      <input id="noteSearch" class="note-search" type="search"
        placeholder="Search your notes...">
      <div id="noteList" class="note-list"></div>
      <p id="noteEmpty" class="note-empty">No notes yet.</p>
    </section>
  </section>

  <section id="tasksScreen" class="screen" hidden>
    <section class="task-panel">
      <div class="task-heading">
        <div>
          <h2>MY TASKS</h2>
          <p id="taskSummary">0 open · 0 completed</p>
        </div>
        <span class="task-icon">✓</span>
      </div>
      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text"
          placeholder="What do you need to do?"
          maxlength="180" required>
        <div class="task-options">
          <select id="taskPriority">
            <option value="normal">Normal priority</option>
            <option value="high">High priority</option>
            <option value="low">Low priority</option>
          </select>
          <input id="taskDueDate" type="date">
          <button type="submit" class="task-add-button">ADD TASK</button>
        </div>
      </form>
      <div class="task-filters">
        <button type="button" class="task-filter active" data-filter="all">ALL</button>
        <button type="button" class="task-filter" data-filter="open">OPEN</button>
        <button type="button" class="task-filter" data-filter="done">COMPLETED</button>
      </div>
      <div id="taskList" class="task-list"></div>
      <p id="taskEmpty" class="task-empty">No tasks yet.</p>
    </section>
  </section>

  <footer>
    <span>PRIVATE BY DESIGN</span>
    <span>RUNNING LOCALLY</span>
  </footer>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
