
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="NOVA, your private local AI assistant.">
  <title>NOVA</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <h1>NOVA</h1>
          <p id="status">LOCAL ASSISTANT · AI NOT LOADED</p>
        </div>
      </div>

      <div class="header-buttons">
        <button id="loadModelButton" class="load-button">LOAD AI</button>
        <button id="clearButton" class="clear-button" aria-label="Clear conversation">＋</button>
      </div>
    </header>

    <!-- TASK MANAGER -->
    <section class="task-panel">
      <div class="task-heading">
        <div>
          <h2>MY TASKS</h2>
          <p id="taskSummary">0 open · 0 completed</p>
        </div>
        <span class="task-icon">✓</span>
      </div>

      <form id="taskForm" class="task-form">
        <input
          id="taskInput"
          type="text"
          placeholder="What do you need to do?"
          maxlength="180"
          required
        >

        <div class="task-options">
          <select id="taskPriority" aria-label="Task priority">
            <option value="normal">Normal priority</option>
            <option value="high">High priority</option>
            <option value="low">Low priority</option>
          </select>

          <input id="taskDueDate" type="date" aria-label="Due date">

          <button type="submit" class="task-add-button">ADD TASK</button>
        </div>
      </form>

      <div class="task-filters">
        <button type="button" class="task-filter active" data-filter="all">ALL</button>
        <button type="button" class="task-filter" data-filter="open">OPEN</button>
        <button type="button" class="task-filter" data-filter="done">COMPLETED</button>
      </div>

      <div id="taskList" class="task-list"></div>
      <p id="taskEmpty" class="task-empty">No tasks yet. Add your first task above.</p>
    </section>

    <!-- AI PROGRESS -->
    <div id="progressArea" class="progress-area">
      <div id="progressText">AI model not loaded</div>
      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
    </div>

    <!-- CHAT -->
    <section id="chatMessages" class="messages">
      <div class="message assistant">
        <div class="sender">NOVA</div>
        <div class="bubble">
          Hello. I'm NOVA. Load my local AI model to start talking with me.
        </div>
      </div>
    </section>

    <form id="chatForm" class="composer">
      <input
        id="messageInput"
        type="text"
        placeholder="Message NOVA..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">SEND</button>
    </form>

    <footer>
      <span>PRIVATE BY DESIGN</span>
      <span>RUNNING LOCALLY</span>
    </footer>

  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
